name: Linux CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build .deb
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VER="1.0.0+${GITHUB_RUN_NUMBER}";; esac
          sh packaging/build_deb.sh "$VER" dist
      - uses: actions/upload-artifact@v4
        with:
          name: popy-keyboard-deb
          path: dist/*.deb
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            packaging/popy-keyboard-repair.sh
